# Nixpacks configuration for Python Flask app
# Railway deployment configuration with runtime dependency installation
providers = ["python"]

[phases.setup]
# 'tectonic' is a self-contained LaTeX engine used to typeset the
# comprehensive PDF report (downloads packages on demand; no full TeX Live).
nixPkgs = ['python311', 'gcc', 'libstdcxx5', 'tectonic']

# Use startup script to install missing dependencies at runtime
[start]
cmd = 'bash start.sh'
